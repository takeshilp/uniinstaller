[package]
name = "uni-core"
version = "0.1.0"
edition = "2024"

[lib]
name = "uni_core"

[dependencies]
serde.workspace = true
serde_json.workspace = true
png = "0.18"
winreg = "0.56"
windows = { version = "0.62", features = [
  "Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Security", "Win32_Security_Authorization", "Win32_Security_Cryptography", "Win32_Storage_FileSystem", "Win32_System_Com",
  "Win32_System_Diagnostics_ToolHelp", "Win32_System_Environment", "Win32_System_Ole", "Win32_System_Registry", "Win32_System_RestartManager", "Win32_System_Services",
  "Win32_System_SystemInformation", "Win32_System_TaskScheduler", "Win32_System_Threading", "Win32_System_Variant",
  "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging" ] }

[dev-dependencies]
tempfile = "3"
windows = { version = "0.62", features = ["Win32_System_ProcessStatus"] }
